name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Snap
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build ${{ env.SNAP_NAME }}
      run: snap build --snap ${{ env.SNAP_NAME }}
      env:
        SNAP_NAME: mimo2-6-distill
  
  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run inference tests
      run: inference-snaps-cli test --snap ${{ env.SNAP_NAME }}
      env:
        SNAP_NAME: mimo2-6-distill
        REPO_NAME: mimo-snap

